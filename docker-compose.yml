version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: rag_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_indexes:/app/faiss_indexes
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
