services:
  - type: web
    name: braindoc-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: fullstack_app
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: FAISS_INDEX_DIR
        value: faiss_indexes
      - key: FRONTEND_URL
        sync: false
    disk:
      name: braindoc-data
      mountPath: /opt/render/project/src
      sizeGB: 1
