services:
  - type: web
    name: braindoc-backend
    runtime: python
    buildCommand: cd backend && pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: fullstack_app
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: FAISS_INDEX_DIR
        value: /tmp/faiss_indexes
      - key: FRONTEND_URL
        sync: false
      - key: RENDER
        value: "true"
