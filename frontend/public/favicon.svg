<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#112D4E"/>
  <!-- Document shape -->
  <rect x="12" y="10" width="30" height="38" rx="4" fill="#DBE2EF" opacity="0.9"/>
  <rect x="16" y="18" width="18" height="2.5" rx="1.2" fill="#3F72AF"/>
  <rect x="16" y="24" width="22" height="2.5" rx="1.2" fill="#3F72AF" opacity="0.6"/>
  <rect x="16" y="30" width="14" height="2.5" rx="1.2" fill="#3F72AF" opacity="0.4"/>
  <!-- Brain nodes on document -->
  <circle cx="20" cy="38" r="2" fill="#3F72AF"/>
  <circle cx="28" cy="35" r="2" fill="#3F72AF"/>
  <circle cx="36" cy="38" r="2" fill="#3F72AF"/>
  <line x1="20" y1="38" x2="28" y2="35" stroke="#3F72AF" stroke-width="1.2" opacity="0.7"/>
  <line x1="28" y1="35" x2="36" y2="38" stroke="#3F72AF" stroke-width="1.2" opacity="0.7"/>
  <!-- Chat bubble -->
  <rect x="34" y="28" width="18" height="14" rx="5" fill="#3F72AF"/>
  <polygon points="36,42 34,46 40,42" fill="#3F72AF"/>
  <!-- Dots in chat bubble -->
  <circle cx="40" cy="35" r="1.5" fill="white"/>
  <circle cx="44" cy="35" r="1.5" fill="white"/>
  <circle cx="48" cy="35" r="1.5" fill="white"/>
</svg>
